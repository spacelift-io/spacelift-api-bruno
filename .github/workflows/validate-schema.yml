name: Validate Schema

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # KLUDGE: what pre-commit/action did, on current actions. It is
      # maintenance-only and pins actions/cache@v4, which targets a deprecated
      # Node.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - run: python -m pip install pre-commit

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}

      - run: pre-commit run --all-files --show-diff-on-failure --color=always

      - name: Test
        run: npm test

      - name: Check destructive requests prompt for their IDs
        run: npm run destructive-prompts:check

      - name: Check every folder is documented
        run: npm run sync-docs:check-folders

      # No changelog check: entries are collected on main after merge, by
      # changelog.yml, so a pull request is never expected to carry them.
