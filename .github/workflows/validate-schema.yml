name: Validate Schema

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # collection-changelog:check reads history back to .collection-changelog-commit
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - uses: pre-commit/action@v3.0.1

      - name: Check changelog
        run: npm run collection-changelog:check
