repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-json
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: prettier
        name: Format with Prettier
        entry: npx prettier --write
        language: system
        files: \.(js|json|ya?ml|md)$

      - id: validate-schema
        name: Validate Bruno requests against schema
        entry: npm run validate
        language: system
        pass_filenames: false
        files: \.bru$

      # Offline and instant, unlike validate-schema — safe to run on every
      # commit that touches the collection or the docs module.
      - id: folder-docs
        name: Check every folder is documented
        entry: npm run sync-docs:check-folders
        language: system
        pass_filenames: false
        files: (\.bru$|^scripts/folder-docs\.js$)
