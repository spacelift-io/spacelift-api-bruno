repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-json
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  # actionlint runs shellcheck on every `run:` script, but only when it finds
  # shellcheck on PATH, and says nothing when it does not. GitHub's runners
  # have it and most machines do not, so the upstream hook passed locally and
  # failed in CI. Installing both from PyPI makes the check the same
  # everywhere. `pre-commit autoupdate` does not bump these; edit the pins.
  - repo: local
    hooks:
      - id: actionlint
        name: Lint GitHub Actions workflow files
        language: python
        entry: actionlint
        additional_dependencies:
          - actionlint-py==1.7.12.25
          - shellcheck-py==0.11.0.1
        files: ^\.github/workflows/

  - repo: local
    hooks:
      - id: prettier
        name: Format with Prettier
        entry: npx prettier --write
        language: system
        files: \.(js|json|ya?ml|md)$

      - id: validate-schema
        name: Validate Bruno requests against schema
        entry: npm run validate
        language: system
        pass_filenames: false
        files: \.bru$

      # Offline and instant, unlike validate-schema — safe to run on every
      # commit that touches the collection or the docs module.
      - id: folder-docs
        name: Check every folder is documented
        entry: npm run sync-docs:check-folders
        language: system
        pass_filenames: false
        files: (\.bru$|^scripts/folder-docs\.js$)

      - id: destructive-prompts
        name: Check destructive requests prompt for their IDs
        entry: npm run destructive-prompts:check
        language: system
        pass_filenames: false
        files: (\.bru$|^scripts/destructive-prompts\.js$)

      - id: test
        name: Test the collection structure and auth script
        entry: npm test
        language: system
        pass_filenames: false
        files: (\.bru$|^scripts/test\.js$)
